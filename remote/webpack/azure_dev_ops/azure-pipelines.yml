trigger:
  branches:
    include:
      - main
      - develop
      - development

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: MICROFRONTEND_ORCHESTRATOR_DOMAIN_RESOLVED
    value: $[coalesce(variables['MICROFRONTEND_ORCHESTRATOR_DOMAIN'], '%domain%')]

stages:
  - stage: Build
    displayName: '🏗️ Build Vite.js Application'
    jobs:
      - job: BuildJob
        displayName: '⚙️ Build and Test'
        steps:
          - checkout: self
            fetchDepth: '0'

          - script: |
              set -e
              # Determine version from Git tag if available
              if [[ "${BUILD_SOURCEBRANCH}" == refs/tags/* ]]; then
                VERSION="${BUILD_SOURCEBRANCHNAME}"
              else
                # Ensure tags are fetched and try to get latest tag reachable from HEAD
                git fetch --tags --force
                if VERSION=$(git describe --tags --abbrev=0 2>/dev/null); then
                  :
                else
                  VERSION="${BUILD_BUILDNUMBER}"
                fi
              fi
              echo "Using version: $VERSION"
              echo "##vso[task.setvariable variable=PackageVersion]$VERSION"
            displayName: '🔖 Resolve version from Git tag'

          - task: NodeTool@0
            displayName: '📦 Install Node.js'
            inputs:
              versionSpec: '24.x'

          - script: corepack enable
            displayName: '📦 Enable pnpm (corepack)'

          - task: Cache@2
            displayName: '💾 Cache node_modules'
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: node_modules
              restoreKeys: |
                pnpm | "$(Agent.OS)"

          - script: pnpm i
            displayName: '📥 Install dependencies'

          - script: pnpm build
            displayName: '🔨 Build Vite project'

          - task: PublishPipelineArtifact@1
            displayName: '📤 Publish build artifacts'
            inputs:
              targetPath: 'dist'
              artifact: 'vite-app'

          - task: mfe-orchestrator-upload@1
            displayName: '🚀 Publish to MFE Orchestrator'
            inputs:
              apiKey: $(FLIGHTROOM_API_KEY)
              microfrontendSlug: '%microfrontendSlug%'
              filePath: '$(Build.ArtifactStagingDirectory)/dist'
              version: '$(PackageVersion)'
              domain: '$(MICROFRONTEND_ORCHESTRATOR_DOMAIN_RESOLVED)'