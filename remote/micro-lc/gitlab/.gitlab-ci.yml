stages:
  - install
  - lint
  - build
  - deploy

variables:
  NODE_VERSION: "24"

# pnpm comes from the packageManager field of package.json, through corepack
.pnpm_cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

install:
  stage: install
  image: node:${NODE_VERSION}
  extends: .pnpm_cache
  script:
    - echo "Dependencies installed"
  artifacts:
    paths:
      - node_modules/
      - .pnpm-store
    expire_in: 1 hour

# The template has no test suite: the type check is the gate
typecheck:
  stage: lint
  image: node:${NODE_VERSION}
  extends: .pnpm_cache
  dependencies:
    - install
  script:
    - pnpm run typecheck

build:
  stage: build
  image: node:${NODE_VERSION}
  extends: .pnpm_cache
  dependencies:
    - install
  script:
    - pnpm run build
    # The micro-lc parcel is served by dist/parcel.js, the entry point of the microfrontend
    - test -f dist/parcel.js
    - echo "Build completed successfully"
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  only:
    - main
    - develop
    - tags

deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  variables:
    MICROFRONTEND_SLUG: "%microfrontendSlug%"
    # Base URL of your orchestrator console. Set a project CI/CD variable of the
    # same name to publish to a different installation.
    MICROFRONTEND_ORCHESTRATOR_DOMAIN: "%domain%"
  before_script:
    - apk add --no-cache curl zip
  script:
    - cd dist && zip -qr ../dist.zip . && cd ..
    - |
      curl --fail --show-error --silent -X POST \
        -H "api-key: ${MICROFRONTEND_ORCHESTRATOR_API_KEY}" \
        -F "file=@dist.zip" \
        "${MICROFRONTEND_ORCHESTRATOR_DOMAIN%/}/api/microfrontends/by-slug/${MICROFRONTEND_SLUG}/upload/${CI_COMMIT_TAG}"
    - echo "published ${MICROFRONTEND_SLUG} ${CI_COMMIT_TAG}"
  only:
    - tags
