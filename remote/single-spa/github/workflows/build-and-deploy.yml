name: 🚀 Build and deploy

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: 'Version to release'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # pnpm comes from the packageManager field of package.json
    - name: 🔄 Setup pnpm
      uses: pnpm/action-setup@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: 🔧 Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: 🏗️ Build
      run: pnpm build

    # The single-spa application is served by dist/index.js, the entry point of the microfrontend
    - name: 🔍 Check the entry point
      run: test -f dist/index.js

    - name: 🚀 Publish to MFE Orchestrator
      uses: mfe-orchestrator-hub/github-action@0.0.29
      with:
        apikey: ${{ secrets.MICROFRONTEND_ORCHESTRATOR_API_KEY }}
        microfrontend-slug: %microfrontendSlug%
        domain: ${{ vars.MICROFRONTEND_ORCHESTRATOR_DOMAIN || '%domain%' }}
        file-path: './dist'
        version: ${{ inputs.version || github.ref_name }}
