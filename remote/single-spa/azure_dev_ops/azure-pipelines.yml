trigger:
  branches:
    include:
      - main
      - develop
      - development
  tags:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: '🏗️ Build'
    jobs:
      - job: BuildJob
        displayName: '⚙️ Build single-spa remote'
        steps:
          - task: NodeTool@0
            displayName: '📦 Install Node.js'
            inputs:
              versionSpec: '24.x'

          # pnpm comes from the packageManager field of package.json
          - script: corepack enable
            displayName: '📦 Enable pnpm (corepack)'

          - task: Cache@2
            displayName: '💾 Cache node_modules'
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: node_modules
              restoreKeys: |
                pnpm | "$(Agent.OS)"

          - script: pnpm i --frozen-lockfile
            displayName: '📥 Install dependencies'

          - script: pnpm build
            displayName: '🔨 Build project'

          # The single-spa application is served by dist/index.js, the entry point of the microfrontend
          - script: test -f dist/index.js
            displayName: '🔍 Check the entry point'

          - task: PublishPipelineArtifact@1
            displayName: '📤 Publish build artifacts'
            inputs:
              targetPath: 'dist'
              artifact: 'app'

  - stage: Deploy
    displayName: '🚀 Deploy'
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    variables:
      - group: MFE_ORCHESTRATOR_SECRETS
      - name: VERSION
        value: $[replace(variables['Build.SourceBranch'], 'refs/tags/', '')]
      - name: MICROFRONTEND_ORCHESTRATOR_DOMAIN_RESOLVED
        value: $[coalesce(variables['MICROFRONTEND_ORCHESTRATOR_DOMAIN'], '%domain%')]
    jobs:
      - job: Deploy
        displayName: '📦 Upload Microfrontend'
        steps:
          - checkout: none

          # The pair of PublishPipelineArtifact: lands in $(Pipeline.Workspace)/app
          - download: current
            displayName: '📥 Download build artifacts'
            artifact: 'app'

          - task: flightroom-upload@1
            displayName: '🚀 Upload to MFE Orchestrator'
            inputs:
              apiKey: '$(MICROFRONTEND_ORCHESTRATOR_API_KEY)'
              microfrontendSlug: '%microfrontendSlug%'
              filePath: '$(Pipeline.Workspace)/app'
              version: '$(VERSION)'
              domain: '$(MICROFRONTEND_ORCHESTRATOR_DOMAIN_RESOLVED)'
